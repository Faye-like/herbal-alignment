<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>养生科普智能匹配系统 · 首页</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="immerse-body">
<div id="navSlot"></div>

<!-- 视差背景层 -->
<div class="im-bg im-bg-far" data-parallax="0.08"></div>
<div class="im-bg im-bg-mid" data-parallax="0.18"></div>
<div class="im-bg im-bg-near" data-parallax="0.32"></div>

<!-- 鼠标跟随环境光斑 -->
<div class="im-cursor-light" id="cursorLight"></div>

<!-- 滚动粒子画布 -->
<canvas class="im-particles" id="particleCanvas"></canvas>

<!-- 装饰性草本 / 光斑元素（悬停微交互） -->
<div class="im-decor" aria-hidden="true">
  <div class="im-decor-item im-herb im-herb-1" data-float="1">
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 110V56"/><path d="M60 56c-18-6-30-22-30-40 16 0 30 14 30 40Z"/><path d="M60 70c14-4 24-16 24-30-12 0-24 12-24 30Z"/>
      <path d="M60 84c-10-3-18-11-18-21 9 0 18 9 18 21Z"/>
    </svg>
  </div>
  <div class="im-decor-item im-herb im-herb-2" data-float="2">
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 112V60"/><path d="M60 60C42 52 30 38 30 22c14 2 24 16 30 38Z"/><path d="M60 74c16-6 28-20 28-38-12 0-24 14-28 38Z"/>
      <path d="M60 88c-12-2-22-12-22-26 10 0 20 12 22 26Z"/>
    </svg>
  </div>
  <div class="im-decor-item im-herb im-herb-3" data-float="1">
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 108V50"/><path d="M60 50C44 44 32 30 32 14c14 2 24 16 28 36Z"/><path d="M60 66c14-4 24-14 24-28-10 2-20 14-24 28Z"/>
      <path d="M60 82c-10-2-18-10-18-22 8 2 16 12 18 22Z"/>
    </svg>
  </div>
  <div class="im-decor-item im-orb im-orb-1" data-float="3"></div>
  <div class="im-decor-item im-orb im-orb-2" data-float="2"></div>
  <div class="im-decor-item im-orb im-orb-3" data-float="1"></div>
</div>

<!-- 内容：主题序章 -->
<main class="im-main">
  <div class="im-hero">
    <div class="im-eyebrow">养生科普智能匹配系统</div>
    <h1 class="im-title">
      <span class="im-line">脆皮青年请注意，</span>
      <span class="im-line">把「爱老己」当个事儿办</span>
    </h1>
    <p class="im-sub">
      <span class="im-word">先</span><span class="im-word">把</span><span class="im-word">情</span><span class="im-word">绪</span><span class="im-word">价</span><span class="im-word">值</span><span class="im-word">给</span><span class="im-word">自</span><span class="im-word">己</span><span class="im-word">：</span>
      <span class="im-word">一</span><span class="im-word">杯</span><span class="im-word">温</span><span class="im-word">水</span><span class="im-word">、</span>
      <span class="im-word">一</span><span class="im-word">次</span><span class="im-word">早</span><span class="im-word">睡</span><span class="im-word">、</span>
      <span class="im-word">下</span><span class="im-word">楼</span><span class="im-word">走</span><span class="im-word">两</span><span class="im-word">步</span><span class="im-word">，</span>
      <span class="im-word">如</span><span class="im-word">何</span><span class="im-word">呢</span><span class="im-word">，</span>
      <span class="im-word">又</span><span class="im-word">能</span><span class="im-word">怎</span><span class="im-word">。</span>
    </p>
    <a class="im-quiz-btn" href="/quiz">
      <span class="im-quiz-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .2c0 1.7-2.5 2-2.5 3.8"/><circle cx="12" cy="17" r="0.8"/></svg>
      </span>
      来测测你是哪种「药材塑」
    </a>
  </div>
  <div class="im-scroll-hint" aria-hidden="true">
    <span></span>
  </div>
</main>

<div id="footerSlot"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/index.js"></script>
</body>
</html>
